[package]
name = "lute-owner"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "MIT"
publish = false
description = "Lute owner key tool. Runs on the owner's machine only; the private key never leaves it."

[dependencies]
ed25519-dalek = { version = "2", features = ["rand_core"] }
rand_core = { version = "0.6", features = ["getrandom"] }
sha2 = "0.10"
hex = "0.4"
serde_json = "1"
clap = { version = "4", features = ["derive"] }
anyhow = "1"

[profile.release]
codegen-units = 1
lto = "thin"
