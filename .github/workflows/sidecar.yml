name: wallet-sidecar

on:
  push:
    paths: ["services/wallet-sidecar/**", ".github/workflows/sidecar.yml"]
  pull_request:
    paths: ["services/wallet-sidecar/**", ".github/workflows/sidecar.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    # Ubuntu 24.04 matches the deployment VPS glibc (docs/DECISIONS.md D-006).
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: services/wallet-sidecar
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: services/wallet-sidecar
      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Test
        run: cargo test --locked
      - name: Release build
        run: cargo build --release --locked
      - uses: actions/upload-artifact@v4
        with:
          name: lute-sidecar-x86_64-linux-gnu
          path: services/wallet-sidecar/target/release/lute-sidecar
          retention-days: 14

  gitleaks:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.24.2/gitleaks_8.24.2_linux_x64.tar.gz | tar xz gitleaks
          ./gitleaks git --redact --verbose .
