[package]
name = "lute-signer"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Browser-side Lute signer: derives viewing keys from a user-held seed and signs Ironwood PCZTs after checking what they pay."
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = []
wasm = ["dep:wasm-bindgen", "dep:getrandom02", "dep:getrandom04"]

# Versions pinned to the wallet sidecar's (services/wallet-sidecar/Cargo.toml) so both sides
# agree on the PCZT encoding and key derivation.
[dependencies]
anyhow = "1"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand_core = { version = "0.6", features = ["getrandom"] }
pczt = { version = "=0.9.3", default-features = false, features = ["std", "orchard", "signer"] }
orchard = { version = "=0.15.5", default-features = false, features = ["std"] }
zcash_keys = { version = "=0.16.1", features = ["orchard", "sapling"] }
zcash_protocol = { version = "=0.10.6" }
zcash_address = "=0.13.0"
zip32 = "0.2"

wasm-bindgen = { version = "0.2", optional = true }
getrandom02 = { package = "getrandom", version = "0.2", features = ["js"], optional = true }
getrandom04 = { package = "getrandom", version = "0.4", features = ["wasm_js"], optional = true }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
